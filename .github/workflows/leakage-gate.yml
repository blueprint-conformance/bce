name: leakage-gate

# The FIRST workflow of this repository: a dependency-free, NUL-proof
# banned-string scan. It exists from commit #1 so that no internal
# identifier, host, or infrastructure reference can ever land in this tree.
# Pure bash — no actions beyond checkout, no external tools.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  leakage-gate:
    name: leakage-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # Negative control. Until this existed nothing had ever demonstrated this
      # gate refusing anything on purpose — the only evidence any pattern worked
      # was an agent tripping the org-name class twice by accident while writing
      # comments. One class of twenty-four, found by mistake.
      #
      # This is the flip-day guard: the consequence of a silently-broken pattern
      # lands exactly once, when the repository goes public, and is not recoverable
      # by fixing the gate afterwards.
      #
      # Runs BEFORE the real scan, so a broken guard is caught before its verdict
      # is trusted. Probes are assembled from string fragments at runtime — the
      # same technique this workflow uses on its own pattern list — so the
      # self-test does not trip the gate it tests.
      - name: Self-test — every pattern class must catch its own probe
        shell: bash
        run: bash scripts/leakage-gate-selftest.sh

      - name: Banned-string scan (NUL-proof, dependency-free)
        shell: bash
        run: |
          # --- scan body begin ---
          set -euo pipefail

          # Patterns are assembled from fragments at runtime so that this
          # file passes its own scan (no banned literal ever appears in the
          # tree, including here).
          o1="od"; o2="in"; c1="O"
          NAME="${o1}${o2}"            # internal steward name fragment
          # Boundary form: not preceded by a letter — catches hosts/env-vars/dotted/scoped refs
          # (X_NAME_Y, .name, name-labs, @namelabs) while excluding English words that merely
          # contain the letter sequence (enc*ing, c*ing). Tightened per B1 verify (2026-08-04).
          NAME_PAT="(^|[^a-zA-Z])${NAME}"
          STEWARD="${c1}d${o2} Labs"   # exact public attribution, allowlisted files only
          PUBLIC_SECURITY_CONTACT="mitchell@${o1}${o2}-labs.ai" # exact monitored fallback, SECURITY.md only

          # Struck namespace (operator amendment 2026-08-04): the .dev domain was never registered;
          # any reappearance of it is stale doctrine — gate-enforced per B2 leak-audit blocker.
          sn="blueprintconformance"".dev"

          # Steward-internal machinery names (swept + gate-enforced 2026-08-27): a private
          # pipeline codename and an internal product name; neither may reappear on the
          # public face in any spelling.
          dfA="dark"; dfB="factory"
          ocA="open"; ocB="claw"

          t1="redro""cket"
          t2="3d""3d"
          t3="h""es"
          t4="open""value"
          t5="hazel""man"
          t6="la""rs"
          t7="techre""bels"
          t8="fleet""care"
          t9="monkey""vision"

          # Contributor / customer first names (added 2026-08-31, forward defense —
          # all five measure ZERO hits on the tree today; this is not a scrub).
          # BOUNDED, and that is load-bearing: unbounded, the three-letter one matches
          # inside token / broken / taken / tokenize / getOperatorToken — MEASURED at
          # 60 files on this tree before it was added. A pattern that reddens the clean
          # tree does not get fixed, it gets deleted, and the class it guards ships.
          n1="ke""vin"; n2="k""en"; n3="ko""os"

          # Credential-shaped patterns (fragment-assembled where a literal would self-hit).
          # Added per B1 leakage-audit blocker (2026-08-04): the no-credentials discipline is
          # gate-enforced, not audit-only. Belt: GitHub secret scanning + push protection is
          # enabled on the repo (BOOTSTRAP-RUNBOOK Phase C).
          gp="gh""p_"; gs="gh""s_"; go="gh""o_"; gpat="git""hub_pat_"
          pk="PRIV""ATE KEY"
          CRED_PATTERNS=(
            "(^|[^a-zA-Z0-9])sk_[a-zA-Z0-9]{8,}"
            "${gp}[A-Za-z0-9]{10,}"
            "${gs}[A-Za-z0-9]{10,}"
            "${go}[A-Za-z0-9]{10,}"
            "$gpat"
            'AKIA[0-9A-Z]{8,}'
            'xox[baprs]-'
            "-----BEGIN [A-Z ]*${pk}-----"
            'eyJ[A-Za-z0-9_-]{20,}\.eyJ'
          )

          PATTERNS=(
            "$NAME_PAT"
            "$t1"
            "(^|[^a-z0-9_])${t2}([^a-z0-9_]|$)"
            "$t4"
            "$t5"
            "$t7"
            "$t8"
            "$t9"
            "(^|[^a-z0-9_])${t3}([^a-z0-9_]|$)"
            "(^|[^a-z0-9_])${t6}([^a-z0-9_]|$)"
            "(^|[^a-z0-9_])${n1}([^a-z0-9_]|$)"
            "(^|[^a-z0-9_])${n2}([^a-z0-9_]|$)"
            "(^|[^a-z0-9_])${n3}([^a-z0-9_]|$)"
            '77\.42\.80\.233'
            '10\.0\.0\.'
            '136\.243\.'
            '65\.21\.'
            'rule-[0-9]'
            '(^|[^a-z0-9])vp-[a-z0-9]'
            '(^|[^a-z0-9])del-[a-z0-9]'
            'npm\.pkg\.git''hub\.com'
            "$sn"
            "${dfA}[-_. ]?${dfB}"
            "${ocA}${ocB}"
            "${CRED_PATTERNS[@]}"
          )

          # Narrow per-file allowlist: ONLY the exact steward phrase, ONLY in
          # these files. Everything else in these files is still fully scanned,
          # and every other file is scanned with zero exceptions.
          STEWARD_ALLOWLIST=("NOTICE" "GOVERNANCE.md" "TRADEMARKS.md")  # tightened to the ratified three (B1 verify 2026-08-04); widen only by deliberate reviewed PR

          # Immutable public-pilot evidence can collide with textual patterns even when
          # its reviewed bytes are safe (three legacy dummy oracle values and one gzip
          # byte stream). Exceptions are exact path+digest pairs: any byte change drops
          # the exception and restores the normal scan.
          PINNED_EVIDENCE=(
            "research/model-evaluation/pilots/accelerated-v1/artifacts/tasks/boundary-feature/functional-oracle.mjs|ab488713fce71d6272d0d2c1eaf42d0c750ad5873b28122868229db97a9cf1ef"
            "research/model-evaluation/pilots/accelerated-v2/artifacts/tasks/boundary-feature/functional-oracle.mjs|ab488713fce71d6272d0d2c1eaf42d0c750ad5873b28122868229db97a9cf1ef"
            "research/model-evaluation/pilots/accelerated-v3/artifacts/tasks/boundary-feature/functional-oracle.mjs|ab488713fce71d6272d0d2c1eaf42d0c750ad5873b28122868229db97a9cf1ef"
            "research/model-evaluation/pilots/accelerated-v3/artifacts/bce-treatment-runtime-v3.tgz|db2a215679f89bdb76cce65f88e88b529a799ec2b880487315d908c78576d4e7"
          )
          sha256_file() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | awk '{print $1}'
            else shasum -a 256 "$1" | awk '{print $1}'
            fi
          }
          pinned_evidence() {
            local rel="$1" file="$2" entry
            for entry in "${PINNED_EVIDENCE[@]}"; do
              [ "$rel" = "${entry%%|*}" ] || continue
              [ "$(sha256_file "$file")" = "${entry#*|}" ] && return 0
              return 1
            done
            return 1
          }

          fail=0
          while IFS= read -r -d '' f; do
            rel="${f#./}"
            if pinned_evidence "$rel" "$f"; then continue; fi
            allow=0
            for a in "${STEWARD_ALLOWLIST[@]}"; do
              if [ "$rel" = "$a" ]; then allow=1; fi
            done
            for p in "${PATTERNS[@]}"; do
              if [ "$allow" -eq 1 ] && [ "$p" = "$NAME_PAT" ]; then
                # Strip the exact steward phrase first, then scan the remainder.
                hits="$(LC_ALL=C tr -d '\000' < "$f" | sed "s/${STEWARD}//g" | { grep -a -i -n -E -- "$p" || true; })"
              elif [ "$rel" = "SECURITY.md" ] && [ "$p" = "$NAME_PAT" ]; then
                # Strip only the deliberately public fallback address. Any other steward-name
                # occurrence in SECURITY.md remains visible to this same pattern.
                hits="$(LC_ALL=C tr -d '\000' < "$f" | sed "s/${PUBLIC_SECURITY_CONTACT}//g" | { grep -a -i -n -E -- "$p" || true; })"
              else
                hits="$(LC_ALL=C tr -d '\000' < "$f" | { grep -a -i -n -E -- "$p" || true; })"
              fi
              if [ -n "$hits" ]; then
                echo "LEAKAGE HIT in ${rel} (pattern: ${p}):"
                echo "$hits" | head -20
                fail=1
              fi
            done
          done < <(find . -type f ! -path './.git/*' -print0)

          if [ "$fail" -ne 0 ]; then
            echo "leakage-gate: FAIL — banned strings found (see hits above)."
            exit 1
          fi
          echo "leakage-gate: PASS — no banned strings found."
          # --- scan body end ---
