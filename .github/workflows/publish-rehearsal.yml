name: publish-rehearsal

# ==============================================================================
# Rehearse the install, build, exact-archive consumer, and npm dry-run path.
#
# This manually dispatched workflow creates one verified tarball, exercises its
# installed CLI behavior, preserves the consumer evidence, and passes that same
# archive to `npm publish --dry-run`. It also generates and verifies a local
# evidence record. Keep these shared operations aligned with release.yml.
#
# This is a scoped rehearsal with its own result. It does not execute the full
# release gate or substitute for the real tag's release verification. Completed
# historical releases and their incidents remain recorded in docs/release-v*.md.
#
# CANNOT PUBLISH, structurally:
#   * `on:` is workflow_dispatch ONLY -- no push, no tags. It cannot fire on a tag.
#   * the job additionally guards on `github.event_name == 'workflow_dispatch'`.
#   * `--dry-run` is hardcoded, never interpolated from an input.
#   * no NODE_AUTH_TOKEN is wired in; registry publication is disabled by --dry-run.
#
# WHAT THIS DOES NOT REHEARSE (named honestly, not silently skipped):
#   * the real upload to the registry (that is the point of --dry-run);
#   * registry-side authorization or an accepted npm provenance attestation;
#     the OIDC permission shape is configured but dry-run cannot prove acceptance;
#   * keyless signing or verification of release Sigstore bundles;
#   * the draft → asset upload → immutable publish GitHub Release sequence, which
#     needs a real tag and is structurally enforced by the release-proof policy.
# ==============================================================================

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-rehearsal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rehearse:
    name: rehearse exact archive (consumer proof and npm dry-run)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Match the release job's OIDC permission shape. A successful dry-run does
      # not establish that npm will accept provenance or authorize publication.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22.22.2
          registry-url: https://registry.npmjs.org
          cache: npm

      # Mirrors release.yml. The hosted Node 22.22.2 npm can be missing one of its
      # own Arborist modules, so never ask it to overwrite itself. Corepack installs
      # the exact release CLI behind a RUNNER_TEMP shim without invoking that npm.
      - name: Bootstrap exact npm 11.19.1 through Corepack
        shell: bash
        env:
          COREPACK_DEFAULT_TO_LATEST: "0"
        run: |
          set -euo pipefail
          npm_bin="${RUNNER_TEMP}/corepack-bin"
          mkdir -p "$npm_bin"
          corepack install --global npm@11.19.1
          corepack enable npm --install-directory "$npm_bin"
          echo "$npm_bin" >> "$GITHUB_PATH"
          actual="$("$npm_bin/npm" --version)"
          [ "$actual" = "11.19.1" ] || { echo "::error::expected npm 11.19.1, got ${actual}"; exit 1; }
          echo "COREPACK_DEFAULT_TO_LATEST=0" >> "$GITHUB_ENV"
          echo "npm ${actual} bootstrapped outside the hosted Node toolcache"

      - name: Report the toolchain actually under rehearsal
        shell: bash
        run: |
          echo "node $(node --version) / npm $(npm --version)"

      - name: Install (clean, lockfile-exact)
        run: npm ci

      - name: Build the distributable engine
        run: npm run build

      - name: Create and verify the one rehearsal tarball
        shell: bash
        run: |
          set -euo pipefail
          npm pack --ignore-scripts --json --silent > release-pack-output.txt
          tarball="$(node scripts/verify-release-payload.mjs --pack-json release-pack-output.txt --print-filename)"
          node scripts/verify-release-payload.mjs \
            --pack-json release-pack-output.txt \
            --tarball "$tarball" \
            --out release-payload-manifest.json
          echo "RELEASE_TARBALL=$tarball" >> "$GITHUB_ENV"

      - name: Exercise the exact rehearsal tarball as a fresh consumer
        id: route_consumer
        run: node scripts/route-consumer-proof.mjs --tarball "$GITHUB_WORKSPACE/$RELEASE_TARBALL" --out release-route-consumer-proof.json --evidence-dir release-route-consumer-evidence

      - name: Preserve exact-artifact consumer evidence
        if: ${{ !cancelled() && (steps.route_consumer.outcome == 'success' || steps.route_consumer.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: route-consumer-proof-${{ github.run_attempt }}
          path: release-route-consumer-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Rehearse the publish (--dry-run — enumerates the tarball, uploads nothing)
        shell: bash
        run: |
          set -euo pipefail
          # --dry-run is hardcoded. There is no input, variable, or secret that can
          # turn this into a real publish.
          npm publish "$RELEASE_TARBALL" --dry-run --provenance --access public 2>&1 | tee /tmp/publish-dry-run.txt
          echo "--- rehearsal summary ---"
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "would publish ${name}@${version}"

      - name: Assert npm enumerated the verified archive
        shell: bash
        run: |
          set -euo pipefail
          # The exact payload verifier above is authoritative; this checks that
          # the npm dry-run also reported an archive inventory.
          if ! grep -qE 'total files:[[:space:]]*[0-9]+' /tmp/publish-dry-run.txt; then
            echo "::error::rehearsal produced no tarball enumeration — 'total files:' absent from the npm output."
            exit 1
          fi
          files="$(grep -oE 'total files:[[:space:]]*[0-9]+' /tmp/publish-dry-run.txt | grep -oE '[0-9]+' | tail -1)"
          echo "tarball enumerated: ${files} files"
          if [ "$files" -lt 100 ]; then
            echo "::error::only ${files} files packed — expected ~189 (dist, src, fixtures, integrations)."
            echo "A sharp drop means the build did not run or package.json 'files' changed."
            exit 1
          fi

      - name: Rehearse the evidence record (same commands the publish job runs)
        shell: bash
        run: |
          set -euo pipefail
          node dist/cli.js run \
            --blueprint .blueprints/engine.blueprint.json \
            --ct-repo . \
            --emit \
            --emit-evidence-out release-evidence-record.json \
            --emit-wo-out release-remediation-work-orders.json \
            --out release-compliance-report.json
          echo "--- rehearsed evidence record ---"
          cat release-evidence-record.json
          mkdir -p release-evidence-chain
          cp release-evidence-record.json release-evidence-chain/record-001.json
          node tools/verify-chain.mjs release-evidence-chain
          echo "rehearsed evidence record verifies (zero-dep verifier)."

      - name: Rehearsal complete
        shell: bash
        run: |
          echo "publish-rehearsal: PASS — exact archive consumer proof, npm dry-run, and evidence replay passed."
          echo "Consumer evidence was retained in Actions. Registry publication, signing, and GitHub Release publication were not performed."
