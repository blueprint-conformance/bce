name: release

# ==============================================================================
# Tag-gated release to the public npm registry — fail-closed to the last byte.
#
# A tag push (v*) does NOT publish on its own trust: this workflow RE-EXECUTES,
# in this run, at the tag, every proof the repository claims — full suite +
# corpus/recall + self-gate (Lane B) + leakage-gate + the RED/GREEN dist pair —
# and REFUSES to publish unless ALL of them are green HERE. Citation of a prior
# green run is never accepted as the proof (the same discipline ci.yml applies on
# every push). The release evidence is generated, verified, and signed before the
# irreversible registry write; only then does npm publish run.
#
# There is no skip flag. `dry_run` (workflow_dispatch only, default true) runs
# every gate leg and then STOPS BEFORE publish — it proves the gate legs green
# without publishing; it never turns a red leg green.
#
# ------------------------------------------------------------------------------
# HONEST AUTH NOTE — read before expecting a publish to succeed.
#
# `npm publish` to the public registry requires ONE of two operator-provisioned
# authorities, and this workflow creates NEITHER (creating a fake secret would be
# a lie the registry rejects anyway):
#
#   (A) an NPM_TOKEN repository secret — a GRANULAR automation token scoped to
#       publish `bce-engine`. On an account with 2FA set to "auth and writes",
#       the token must be one whose creation was permitted under the account's
#       2FA-bypass-for-automation setting; a classic token on a writes-2FA
#       account will be rejected at publish time by the registry, not here.
#   (B) npmjs Trusted Publishing configured for THIS repository + workflow —
#       OIDC, no stored token. Requires `id-token: write` (granted on the publish
#       job below) AND a trusted-publisher entry created on npmjs.com for
#       blueprint-conformance/bce → .github/workflows/release.yml.
#
# Both are OPERATOR ATOMS done once on npmjs.com; they cannot be done from CI.
# The publish job's pre-flight checks for (A); if NPM_TOKEN is absent it says so
# LOUDLY and continues ONLY so npm's own OIDC path (B) can run — and if (B) is
# also not configured, `npm publish` fails loudly with the registry's own
# "need auth"/"provenance" error. Either way the failure is explicit, named, and
# never a silent skip or a fabricated success.
# ==============================================================================

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Run every release gate leg but STOP BEFORE publish (syntactic + gate
          proof for the workflow itself). Defaults true for a manual dispatch;
          a real publish only happens on a v* tag push.
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  model-evaluation-controller-macos:
    name: release-model-evaluation-controller-macos
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install (clean, lockfile-exact)
        run: npm ci

      - name: Build the treatment artifact
        run: npm run build

      - name: Real controller rehearsal — strict isolation, staged runtime, MCP handshake, crash recovery, and public replay
        run: npm run test:model-eval-controller

  # ----------------------------------------------------------------------------
  # GATE — every proof, re-executed at the tag. This job is the fail-closed wall
  # in front of publish: if any leg reds, the job fails, and the publish job
  # (which `needs:` this one) never runs. Nothing here trusts a prior run.
  # ----------------------------------------------------------------------------
  gate:
    name: release-gate (re-execute every proof at the tag)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dry_run: ${{ steps.mode.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Action supply-chain policy (negative control + full-tree check)
        run: node scripts/check-action-pins.selftest.mjs && node scripts/check-action-pins.mjs

      - name: Release proof policy (negative control + gate check)
        run: node scripts/check-release-proof-policy.selftest.mjs && node scripts/check-release-proof-policy.mjs

      - name: Cross-document release claims (negative controls + truth check)
        run: node scripts/check-release-claims.selftest.mjs && node scripts/check-release-claims.mjs

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
          # registry-url writes the .npmrc that makes NODE_AUTH_TOKEN usable, so the
          # publish-auth gate leg below can PROVE the credential against the registry
          # rather than merely observing that a secret is set.
          registry-url: https://registry.npmjs.org

      # node-version:22 ships npm 10.9.x. npm's Trusted Publishing (OIDC) requires
      # npm >= 11.5.1 (and node >= 22.14.0), so auth path (B) is DEAD ON ARRIVAL on
      # the stock toolchain. Do not ask that bundled npm to overwrite itself: the
      # 22.22.2 hosted toolcache can be missing one of npm's own Arborist modules.
      # Corepack downloads the exact CLI without executing the broken npm, then
      # installs its shim in RUNNER_TEMP. This exact ceremony runs in BOTH jobs.
      - name: Bootstrap exact npm 11.19.1 through Corepack
        shell: bash
        env:
          COREPACK_DEFAULT_TO_LATEST: "0"
        run: |
          set -euo pipefail
          npm_bin="${RUNNER_TEMP}/corepack-bin"
          mkdir -p "$npm_bin"
          corepack install --global npm@11.19.1
          corepack enable npm --install-directory "$npm_bin"
          echo "$npm_bin" >> "$GITHUB_PATH"
          actual="$("$npm_bin/npm" --version)"
          [ "$actual" = "11.19.1" ] || { echo "::error::expected npm 11.19.1, got ${actual}"; exit 1; }
          echo "COREPACK_DEFAULT_TO_LATEST=0" >> "$GITHUB_ENV"
          echo "npm ${actual} bootstrapped outside the hosted Node toolcache"

      - name: Resolve release mode (tag push = real; dispatch = dry_run input)
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            # A tag push is always a real release attempt — no dry-run escape on a tag.
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "→ tag push ${{ github.ref_name }} — REAL release (gate then publish)"
          else
            dr="${{ github.event.inputs.dry_run }}"
            # Default-safe: ONLY an explicit 'false' is a real publish; anything
            # else (true, empty, unexpected) stays a dry run. Explicit if — never
            # the &&/|| idiom — because this output is the publish/no-publish gate.
            if [ "$dr" = "false" ]; then
              echo "dry_run=false" >> "$GITHUB_OUTPUT"
            else
              echo "dry_run=true" >> "$GITHUB_OUTPUT"
            fi
            echo "→ workflow_dispatch — dry_run=${dr:-true}"
          fi

      - name: Current public install still resolves before staging its successor
        run: node scripts/verify-public-release.selftest.mjs && node scripts/verify-public-release.mjs

      - name: Guard — package.json version must match the tag (tag push only)
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"          # e.g. v0.1.0
          want="${tag#v}"                        # 0.1.0
          have="$(node -p "require('./package.json').version")"
          if [ "$have" != "$want" ]; then
            echo "::error::tag ${tag} implies version ${want} but package.json is ${have} — the tag and the staged version must agree before publish"
            exit 1
          fi
          echo "package.json version ${have} matches tag ${tag}"

      - name: Install (clean, lockfile-exact)
        run: npm ci

      - name: Build the distributable engine
        run: npm run build

      - name: Release payload boundary — enumerate and refuse non-shipping roots
        run: node scripts/verify-release-payload.selftest.mjs && node scripts/verify-release-payload.mjs --out release-payload-manifest.json

      - name: Typecheck (tsc --noEmit, full tree)
        run: npm run typecheck

      - name: Full vitest suite (no filter)
        run: npm test

      - name: Fresh-consumer full-stack onboarding proof
        run: npm run test:onboarding

      - name: Agent Skills + MCP first-session adoption proof (deterministic, no paid model)
        run: npm run test:ai-adoption

      - name: Independent adoption denominator + adjudication policy
        run: npm run test:adoption-program

      - name: MCP Inspector compatibility + startup SLO proof
        run: npm run test:mcp-compatibility

      - name: Synthetic 2,000-file scale budget + planted RED control
        run: npm run test:scale

      - name: External implementation intake contract + negative control
        run: npm run test:external-contract

      - name: Synthetic sealed v2 model-evaluation replay + causal-integrity controls (not efficacy evidence)
        run: npm run test:model-eval-protocol

      - name: Restricted-network runtime + hostile proxy/registry proof
        run: npm run test:restricted-network

      - name: OpenAI plugin archive validates with negative controls
        run: npm run test:codex-plugin

      - name: Two-clean-install runtime graph + report reproducibility proof
        run: npm run test:reproducibility

      - name: Corpus / measured-recall run (recall arithmetic + real-engine e2e proof)
        run: npx vitest run tests/recall-gate.test.ts tests/recall-e2e-proof.test.ts

      - name: Self-gate (Lane B) — validate + real-source teeth + self-blueprint sync + evidence chain, fail-closed
        shell: bash
        run: |
          set -euo pipefail
          node dist/cli.js validate --blueprint .blueprints/engine.blueprint.json
          node dist/cli.js gate --repo . --repo-name blueprint-conformance/bce
          npm run test:self-teeth-mutations
          npx vitest run tests/self-blueprint.test.ts
          node tools/verify-chain.mjs evidence/example-chain
          echo "--- teeth report (surfaced in the run log) ---"
          cat extractor-teeth-report.json

      - name: Leakage negative controls — canonical scanner catches every policy class
        shell: bash
        run: bash scripts/leakage-gate-selftest.sh

      - name: Leakage gate — canonical full-tree scan (re-run at the tag)
        shell: bash
        run: bash scripts/leakage-scan.sh .

      - name: RED/GREEN discriminating pair (built dist CLI, real exit codes)
        shell: bash
        run: |
          set -euo pipefail
          # One blueprint, two trees, opposite verdicts — a gate that cannot go red is not a gate.
          BPD="$(mktemp -d)"
          cp fixtures/luna-chat-extension.blueprint.json "$BPD/"

          echo "--- GREEN leg: conformant tree must PASS (exit 0) ---"
          set +e
          node dist/cli.js gate --repo fixtures/extension-surface/conformant --blueprint-dir "$BPD" --extractor ast > green.out 2> green.err
          rc_green=$?
          set -e
          cat green.out green.err
          [ "$rc_green" -ne 0 ] && { echo "::error::GREEN leg exited ${rc_green} (expected 0)"; exit 1; }
          grep -q "score 100 (pass)" green.out || { echo "::error::GREEN leg exit 0 but pass marker missing"; exit 1; }

          echo "--- RED leg: drifted tree must FAIL (exit exactly 1, violation named) ---"
          set +e
          node dist/cli.js gate --repo fixtures/extension-surface/drift-forbidden-import --blueprint-dir "$BPD" --extractor ast > red.out 2> red.err
          rc_red=$?
          set -e
          cat red.out red.err
          [ "$rc_red" -ne 1 ] && { echo "::error::RED leg exited ${rc_red} (expected exactly 1)"; exit 1; }
          grep -q "FAILED" red.err || { echo "::error::RED leg exit 1 but no FAILED verdict on stderr"; exit 1; }
          grep -q "no-direct-provider-sdk" red.err || { echo "::error::RED leg failed without naming the seeded violation"; exit 1; }
          echo "RED/GREEN discriminating pair: PROVEN — opposite verdicts by real exit codes (0 / 1)."

      - name: Citation gate — CITATION.cff must carry no placeholder identifiers
        run: node scripts/check-release-citation.mjs

      # ----------------------------------------------------------------------
      # PUBLISH-AUTH GATE — the credential is proven HERE, not discovered at the tag.
      #
      # The publish job's pre-flight only WARNS when no credential is configured, and
      # then lets `npm publish` fail with the registry's own error. That is honest but
      # it is late: by then the tag exists, every other proof has run, and the failure
      # lands at the least reversible moment of the release ceremony. This leg moves
      # that discovery into the gate job, where a dry-run can see it days earlier.
      #
      # It PROVES rather than observes. A presence check ("is the secret set?") would
      # still miss the exact trap this workflow's own header calls out — a classic
      # token on a writes-2FA account is accepted by CI and rejected by the registry
      # at publish time. `npm whoami` makes the registry itself answer, now.
      #
      # `!cancelled()` so this leg reports alongside the citation gate rather than
      # being skipped by it — a dry-run should surface EVERY missing precondition in
      # one run, not one per re-dispatch.
      - name: Publish-auth gate — prove a usable publish credential exists BEFORE the tag
        if: ${{ !cancelled() }}
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TRUSTED_PUBLISHING_ACK: ${{ vars.NPM_TRUSTED_PUBLISHING_CONFIGURED }}
        run: |
          set -uo pipefail
          # Measure and REPORT the toolchain unconditionally, before branching. The
          # floor is only load-bearing for path (B) (OIDC), so it is only ENFORCED
          # there -- but a dry-run with no credential configured must still show
          # which npm the release would use, or the fix is unobservable exactly when
          # someone is checking whether it landed.
          npmv="$(npm --version)"
          echo "publish-auth gate: npm CLI ${npmv} (Trusted-Publishing floor 11.5.1)"
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            # Auth path (A). Make the registry adjudicate the token, not us.
            if who="$(npm whoami --registry=https://registry.npmjs.org 2>&1)"; then
              echo "publish-auth gate: PASS (proven) — the registry accepts NPM_TOKEN as '${who}'."
              exit 0
            fi
            echo "::error::publish-auth gate: FAIL — NPM_TOKEN is set but the registry REJECTED it."
            echo "registry said: ${who}"
            echo "This is the trap this workflow's header names: a CLASSIC token on an account with"
            echo "2FA set to 'auth and writes' is refused at publish time. Re-mint as a GRANULAR"
            echo "automation token scoped to publish this package, or configure Trusted Publishing."
            exit 1
          fi
          if [ "${TRUSTED_PUBLISHING_ACK:-}" = "true" ]; then
            # Auth path (B). Two conditions, and the ACK is only one of them.
            #
            # The ACK is self-asserted: npm exposes no pre-publish query for a
            # trusted-publisher entry, so nothing here can confirm it. What CAN be
            # measured is the toolchain floor OIDC needs — npm >= 11.5.1. Without it
            # the publish cannot use OIDC at all, so an ACK-only gate would go green
            # while `npm publish` dies. That is the same hazard the token path was
            # fixed for, on the other branch: a gate that reports on a precondition
            # it never checked.
            if [ "$(printf '%s\n%s\n' '11.5.1' "$npmv" | sort -V | head -1)" != "11.5.1" ]; then
              echo "::error::publish-auth gate: FAIL — the ACK is set but npm ${npmv} is BELOW the"
              echo "Trusted-Publishing floor of 11.5.1, so OIDC cannot be used and the publish would"
              echo "fail regardless of the attestation. node-version:22 ships npm 10.9.x; install"
              echo "npm@11.19.1 through Corepack in BOTH the gate and publish jobs. npm also requires node >= 22.14.0."
              exit 1
            fi
            echo "publish-auth gate: PASS (attested + floor proven) — npm ${npmv} meets the OIDC"
            echo "floor, and repository variable NPM_TRUSTED_PUBLISHING_CONFIGURED=true asserts a"
            echo "trusted-publisher entry exists for this repository + workflow. The FLOOR is"
            echo "measured; the ENTRY is still only attested — no pre-publish API can confirm it,"
            echo "and if the attestation is wrong, publish fails with the registry's own OIDC error."
            exit 0
          fi
          echo "::error::publish-auth gate: FAIL — no usable publish credential is configured."
          echo "The tag would pass every other gate leg and then die at 'npm publish'."
          echo "Provision ONE of:"
          echo "  (A) a GRANULAR npm automation token scoped to publish this package, as the"
          echo "      repository secret NPM_TOKEN — this leg will then prove it against the registry;"
          echo "  (B) an npmjs Trusted Publishing entry for this repository + .github/workflows/release.yml,"
          echo "      then set the repository variable NPM_TRUSTED_PUBLISHING_CONFIGURED=true."
          exit 1

      - name: Gate legs all green
        shell: bash
        run: echo "All release gate legs green at ${{ github.ref_name }}. ${{ steps.mode.outputs.dry_run == 'true' && 'DRY RUN — stopping before publish.' || 'Proceeding to publish.' }}"

  # ----------------------------------------------------------------------------
  # PUBLISH — runs ONLY on a real tag push with the gate green and dry_run false.
  # Re-installs + re-builds from a clean tree (never trusts the gate job's
  # artifacts), generates/verifies/signs the release evidence, stages it on a
  # draft GitHub Release, then executes npm publish --provenance --access public.
  # A separate finalizer publishes the prepared draft so a transient GitHub API
  # failure can be retried without attempting the immutable npm publish again.
  # ----------------------------------------------------------------------------
  publish:
    name: publish (provenance) + stage evidence record
    needs: [gate, model-evaluation-controller-macos]
    if: ${{ github.event_name == 'push' && needs.gate.outputs.dry_run == 'false' }}
    runs-on: ubuntu-latest
    environment: release
    outputs:
      evidence_sha256: ${{ steps.stage_release.outputs.evidence_sha256 }}
      sigstore_sha256: ${{ steps.stage_release.outputs.sigstore_sha256 }}
      compliance_sha256: ${{ steps.stage_release.outputs.compliance_sha256 }}
      payload_sha256: ${{ steps.stage_release.outputs.payload_sha256 }}
      payload_sigstore_sha256: ${{ steps.stage_release.outputs.payload_sigstore_sha256 }}
      tarball_sha256: ${{ steps.stage_release.outputs.tarball_sha256 }}
      tarball_name: ${{ steps.stage_release.outputs.tarball_name }}
    permissions:
      contents: write   # create/update the GitHub Release + upload the evidence asset
      id-token: write    # npm provenance + Trusted Publishing (OIDC) — auth path (B)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22.22.2
          registry-url: https://registry.npmjs.org
          cache: npm

      # Must exactly match the gate job. Corepack avoids an in-place self-upgrade
      # of the hosted npm 10.9.x tree, which may be missing its own Arborist module.
      - name: Bootstrap exact npm 11.19.1 through Corepack
        shell: bash
        env:
          COREPACK_DEFAULT_TO_LATEST: "0"
        run: |
          set -euo pipefail
          npm_bin="${RUNNER_TEMP}/corepack-bin"
          mkdir -p "$npm_bin"
          corepack install --global npm@11.19.1
          corepack enable npm --install-directory "$npm_bin"
          echo "$npm_bin" >> "$GITHUB_PATH"
          actual="$("$npm_bin/npm" --version)"
          [ "$actual" = "11.19.1" ] || { echo "::error::expected npm 11.19.1, got ${actual}"; exit 1; }
          echo "COREPACK_DEFAULT_TO_LATEST=0" >> "$GITHUB_ENV"
          echo "npm ${actual} bootstrapped outside the hosted Node toolcache"

      - name: Pre-flight — honest auth check (NPM_TOKEN present, else OIDC-only path)
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "auth path (A): NPM_TOKEN secret is present — publish will authenticate with it."
          else
            echo "::warning::NPM_TOKEN secret is ABSENT. Publish will rely on auth path (B): npmjs Trusted Publishing (OIDC) for blueprint-conformance/bce → .github/workflows/release.yml."
            echo "::warning::If Trusted Publishing is not configured on npmjs.com for this repo+workflow, 'npm publish' below will fail loudly with the registry's own auth error. That is the honest fail-closed outcome — this workflow creates no fake credential."
          fi

      - name: Install (clean, lockfile-exact)
        run: npm ci

      - name: Build the distributable engine
        run: npm run build

      - name: Create the one npm tarball that may be published
        shell: bash
        run: |
          set -euo pipefail
          npm pack --ignore-scripts --json --silent > release-pack-output.txt
          tarball="$(node scripts/verify-release-payload.mjs --pack-json release-pack-output.txt --print-filename)"
          node scripts/verify-release-payload.mjs \
            --pack-json release-pack-output.txt \
            --tarball "$tarball" \
            --out release-payload-manifest.json
          echo "RELEASE_TARBALL=$tarball" >> "$GITHUB_ENV"

      - name: Generate the evidence record of THIS release gate-run before publish
        shell: bash
        run: |
          set -euo pipefail
          # The release moment's own evidence: run the engine over its own tree
          # and emit a chained, deterministic EvidenceRecord. This is the record
          # attached to the Release — the release gate-run made re-derivable with
          # `node tools/verify-chain.mjs`.
          node dist/cli.js run \
            --blueprint .blueprints/engine.blueprint.json \
            --ct-repo . \
            --emit \
            --emit-evidence-out release-evidence-record.json \
            --emit-wo-out release-remediation-work-orders.json \
            --out release-compliance-report.json
          echo "--- release evidence record ---"
          cat release-evidence-record.json
          # Prove the emitted record verifies with the zero-dep verifier before we attach it.
          mkdir -p release-evidence-chain
          cp release-evidence-record.json release-evidence-chain/record-001.json
          node tools/verify-chain.mjs release-evidence-chain
          echo "release evidence record verifies (zero-dep verifier)."

      - name: Keyless-sign and verify the release evidence and payload boundary
        shell: bash
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          node node_modules/@sigstore/cli/bin/run attest \
            release-evidence-record.json \
            --output-file release-evidence-record.sigstore
          node node_modules/@sigstore/cli/bin/run verify \
            release-evidence-record.sigstore \
            --certificate-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-uri "$identity"
          node node_modules/@sigstore/cli/bin/run attest \
            release-payload-manifest.json \
            --output-file release-payload-manifest.sigstore
          node node_modules/@sigstore/cli/bin/run verify \
            release-payload-manifest.sigstore \
            --certificate-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-uri "$identity"
          echo "release evidence and payload-boundary signatures verify for ${identity}."

      - name: Stage the evidence assets on a draft GitHub Release
        id: stage_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          notes="Automated release of $(node -p "require('./package.json').name")@${tag#v}. The attached evidence record is re-derivable and keyless-signed; the signed payload manifest identifies the exact attached npm tarball published with npm provenance."

          # Immutable releases must receive every asset while still drafts. A
          # failed npm publish leaves this draft retryable; it exposes nothing as
          # a completed release and does not weaken repository immutability.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --draft --title "$tag" --notes "$notes"
          fi
          is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
          if [ "$is_draft" != "true" ]; then
            echo "::error::Release ${tag} already exists and is not a draft; immutable assets cannot be staged."
            exit 1
          fi
          gh release upload "$tag" \
            release-evidence-record.json \
            release-evidence-record.sigstore \
            release-compliance-report.json \
            release-payload-manifest.json \
            release-payload-manifest.sigstore \
            "$RELEASE_TARBALL" \
            --clobber
          {
            echo "evidence_sha256=$(sha256sum release-evidence-record.json | awk '{print $1}')"
            echo "sigstore_sha256=$(sha256sum release-evidence-record.sigstore | awk '{print $1}')"
            echo "compliance_sha256=$(sha256sum release-compliance-report.json | awk '{print $1}')"
            echo "payload_sha256=$(sha256sum release-payload-manifest.json | awk '{print $1}')"
            echo "payload_sigstore_sha256=$(sha256sum release-payload-manifest.sigstore | awk '{print $1}')"
            echo "tarball_sha256=$(sha256sum "$RELEASE_TARBALL" | awk '{print $1}')"
            echo "tarball_name=$RELEASE_TARBALL"
          } >> "$GITHUB_OUTPUT"
          echo "staged evidence, exact npm tarball, payload boundary, both Sigstore bundles, and compliance report on draft Release $tag"

      - name: npm publish --provenance --access public (only after evidence verifies)
        shell: bash
        env:
          # Present only if the operator provisioned it (auth path A). Absent → npm
          # falls through to the OIDC Trusted-Publishing path (B) enabled by the
          # id-token:write permission on this job. If neither is usable, npm fails
          # here with a clear auth error — never a silent success.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm publish "$RELEASE_TARBALL" --provenance --access public
          echo "published $(node -p "require('./package.json').name")@$(node -p "require('./package.json').version") with provenance."

  finalize-github-release:
    name: publish prepared immutable GitHub Release
    needs: publish
    if: ${{ github.event_name == 'push' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Verify staged assets and publish the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_EVIDENCE_SHA256: ${{ needs.publish.outputs.evidence_sha256 }}
          EXPECTED_SIGSTORE_SHA256: ${{ needs.publish.outputs.sigstore_sha256 }}
          EXPECTED_COMPLIANCE_SHA256: ${{ needs.publish.outputs.compliance_sha256 }}
          EXPECTED_PAYLOAD_SHA256: ${{ needs.publish.outputs.payload_sha256 }}
          EXPECTED_PAYLOAD_SIGSTORE_SHA256: ${{ needs.publish.outputs.payload_sigstore_sha256 }}
          EXPECTED_TARBALL_SHA256: ${{ needs.publish.outputs.tarball_sha256 }}
          EXPECTED_TARBALL_NAME: ${{ needs.publish.outputs.tarball_name }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          if ! [[ "$EXPECTED_TARBALL_NAME" =~ ^[A-Za-z0-9._-]+\.tgz$ ]]; then
            echo "::error::publish job did not provide a safe tarball asset name."
            exit 1
          fi
          release_json="$(gh release view "$tag" --json isDraft,assets)"
          is_draft="$(jq -r .isDraft <<<"$release_json")"
          for asset in \
            release-evidence-record.json \
            release-evidence-record.sigstore \
            release-compliance-report.json \
            release-payload-manifest.json \
            release-payload-manifest.sigstore \
            "$EXPECTED_TARBALL_NAME"; do
            case "$asset" in
              release-evidence-record.json) expected="$EXPECTED_EVIDENCE_SHA256" ;;
              release-evidence-record.sigstore) expected="$EXPECTED_SIGSTORE_SHA256" ;;
              release-compliance-report.json) expected="$EXPECTED_COMPLIANCE_SHA256" ;;
              release-payload-manifest.json) expected="$EXPECTED_PAYLOAD_SHA256" ;;
              release-payload-manifest.sigstore) expected="$EXPECTED_PAYLOAD_SIGSTORE_SHA256" ;;
              "$EXPECTED_TARBALL_NAME") expected="$EXPECTED_TARBALL_SHA256" ;;
            esac
            if ! [[ "$expected" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::publish job did not provide a valid digest for ${asset}."
              exit 1
            fi
            valid="$(jq --arg asset "$asset" --arg digest "sha256:${expected}" '[.assets[] | select(.name == $asset and .state == "uploaded" and .size > 0 and .digest == $digest)] | length' <<<"$release_json")"
            if [ "$valid" != "1" ]; then
              echo "::error::draft Release ${tag} lacks one valid ${asset} asset."
              exit 1
            fi
          done

          # This is the irreversible GitHub boundary: publishing freezes the tag
          # and the already-uploaded assets together. It is deliberately isolated
          # from npm publish so this job alone can be retried safely. If the edit
          # succeeded but the runner lost the response, a retry observes the
          # already-frozen Release and verifies it instead of trying to republish.
          if [ "$is_draft" = "true" ]; then
            gh release edit "$tag" --draft=false --latest
          fi
          immutable="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq .immutable)"
          if [ "$immutable" != "true" ]; then
            echo "::error::Release ${tag} is neither a prepared draft nor an immutable published release."
            exit 1
          fi
          echo "published immutable Release $tag with all staged evidence assets"
