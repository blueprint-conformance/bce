<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="skill-loop-title skill-loop-desc">
  <title id="skill-loop-title">The BCE Agent Skill closes the code-correction loop</title>
  <desc id="skill-loop-desc">The shipped skills/bce/SKILL.md instructions load on demand. An agent changes source code and calls the read-only run_gate tool. BCE returns the no-direct-http-client violation at greeting.plugin.ts line 16. The agent fixes source code without changing the human-owned blueprint, calls the same gate again, and receives a green exit zero.</desc>
  <defs>
    <marker id="skill-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7890A3"/>
    </marker>
  </defs>
  <style>
    .title{font:700 28px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#E8EBED;letter-spacing:-.4px}
    .lede{font:450 16px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#A9BAC8}
    .node{fill:#0D1025;stroke:#566274;stroke-width:1.5}
    .node-skill,.node-gate{stroke:#61C9EF}.node-red{stroke:#F05C67}.node-green{stroke:#48C99A}
    .node-title{font:650 18px ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;fill:#E8EBED}
    .node-copy{font:450 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#A9BAC8}
    .node-code{font:450 13px ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;fill:#C9D5E1}
    .cyan{fill:#61C9EF}.red{fill:#F05C67}.green{fill:#48C99A}.steel{fill:#7890A3}
    .route{fill:none;stroke:#7890A3;stroke-width:1.8;marker-end:url(#skill-arrow)}
    .policy-route{fill:none;stroke:#7890A3;stroke-width:1.5;stroke-dasharray:5 7}
    .trace{fill:none;stroke:#61C9EF;stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:skill-draw .58s cubic-bezier(.16,1,.3,1) forwards}
    .trace-red{stroke:#F05C67}.trace-green{stroke:#48C99A}
    .t1{animation-delay:.62s}.t2{animation-delay:1.28s}.t3{animation-delay:1.94s}
    .t4{animation-delay:2.6s}.t5{animation-delay:3.26s}.t6{animation-delay:3.92s}
    .focus{fill:none;stroke-width:3;opacity:0;animation:skill-cue .76s cubic-bezier(.16,1,.3,1) forwards}
    .f0{stroke:#61C9EF;animation-delay:.05s}.f1{stroke:#61C9EF;animation-delay:.7s}
    .f2{stroke:#61C9EF;animation-delay:1.36s}.f3{stroke:#F05C67;animation-delay:2.02s}
    .f4{stroke:#61C9EF;animation-delay:2.68s}.f5{stroke:#61C9EF;animation-delay:3.34s}
    .f6{stroke:#48C99A;animation:skill-arrive .85s cubic-bezier(.16,1,.3,1) 4s forwards}
    @keyframes skill-draw{to{stroke-dashoffset:0}}
    @keyframes skill-cue{0%,100%{opacity:0}28%,72%{opacity:1}}
    @keyframes skill-arrive{0%{opacity:0}45%,100%{opacity:1}}
    @media (prefers-reduced-motion: reduce){
      .trace,.focus{animation:none;opacity:0}
      .f6{animation:none;opacity:1}
    }
  </style>

  <rect width="1280" height="430" rx="4" fill="#080919"/>
  <text class="title" x="48" y="50">The skill closes the agent loop</text>
  <text class="lede" x="48" y="77">Instructions guide the repair. The engine decides the result.</text>

  <path class="route" d="M283 157.5H310"/>
  <path class="route" d="M545 157.5H590"/>
  <path class="route" d="M825 157.5H875"/>
  <path class="route" d="M1040 205V280"/>
  <path class="route" d="M875 327.5H825"/>
  <path class="route" d="M590 327.5H545"/>

  <path class="policy-route" d="M283 350H560V240H707V205"/>
  <path class="policy-route" d="M560 350V405H707V375"/>
  <text class="node-copy steel" x="310" y="241">same checked-in policy</text>
  <text class="node-copy steel" x="310" y="264">feeds both gate runs</text>

  <path class="trace t1" pathLength="1" d="M283 157.5H310"/>
  <path class="trace t2" pathLength="1" d="M545 157.5H590"/>
  <path class="trace trace-red t3" pathLength="1" d="M825 157.5H875"/>
  <path class="trace t4" pathLength="1" d="M1040 205V280"/>
  <path class="trace t5" pathLength="1" d="M875 327.5H825"/>
  <path class="trace trace-green t6" pathLength="1" d="M590 327.5H545"/>

  <g data-step="load-skill">
    <rect class="node node-skill" x="48" y="110" width="235" height="95" rx="4"/>
    <text class="node-title cyan" x="68" y="145">skills/bce/SKILL.md</text>
    <text class="node-copy" x="68" y="174">loads on demand</text>
  </g>
  <g data-step="change-code">
    <rect class="node" x="310" y="110" width="235" height="95" rx="4"/>
    <text class="node-title" x="330" y="145">agent changes code</text>
    <text class="node-copy" x="330" y="174">live working tree</text>
  </g>
  <g data-step="gate-red">
    <rect class="node node-gate" x="590" y="110" width="235" height="95" rx="4"/>
    <text class="node-title cyan" x="610" y="145">run_gate {}</text>
    <text class="node-copy" x="610" y="174">read-only · same engine</text>
  </g>
  <g data-step="diagnose">
    <rect class="node node-red" x="875" y="110" width="330" height="95" rx="4"/>
    <text class="node-title red" x="895" y="139">1 · BLOCK</text>
    <text class="node-code" x="895" y="166">no-direct-http-client</text>
    <text class="node-code red" x="895" y="187">greeting.plugin.ts#L16</text>
  </g>
  <g data-step="fix-code">
    <rect class="node" x="875" y="280" width="330" height="95" rx="4"/>
    <text class="node-title" x="895" y="315">fix source code</text>
    <text class="node-copy" x="895" y="344">policy is not edited</text>
  </g>
  <g data-step="gate-green">
    <rect class="node node-gate" x="590" y="280" width="235" height="95" rx="4"/>
    <text class="node-title cyan" x="610" y="315">run_gate {}</text>
    <text class="node-copy" x="610" y="344">live tree · same contract</text>
  </g>
  <g data-step="pass">
    <rect class="node node-green" x="310" y="280" width="235" height="95" rx="4"/>
    <text class="node-title green" x="330" y="315">0 · MERGE</text>
    <text class="node-copy" x="330" y="344">GREEN · score 100</text>
  </g>

  <g aria-label="The unchanged human-owned policy">
    <rect class="node" x="48" y="280" width="235" height="95" rx="4"/>
    <text class="node-title" x="68" y="315">EngineeringBlueprint</text>
    <text class="node-copy steel" x="68" y="344">human-owned · unchanged</text>
  </g>

  <rect class="focus f0" x="46.5" y="108.5" width="238" height="98" rx="5"/>
  <rect class="focus f1" x="308.5" y="108.5" width="238" height="98" rx="5"/>
  <rect class="focus f2" x="588.5" y="108.5" width="238" height="98" rx="5"/>
  <rect class="focus f3" x="873.5" y="108.5" width="333" height="98" rx="5"/>
  <rect class="focus f4" x="873.5" y="278.5" width="333" height="98" rx="5"/>
  <rect class="focus f5" x="588.5" y="278.5" width="238" height="98" rx="5"/>
  <rect class="focus f6" x="308.5" y="278.5" width="238" height="98" rx="5"/>
</svg>
