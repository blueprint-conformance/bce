<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1120" viewBox="0 0 760 1120" role="img" aria-labelledby="title desc">
  <title id="title">The BCE architecture package</title>
  <desc id="desc">A human-owned EngineeringBlueprint declares four architecture constraints. BCE compares them with the observed repository graph. The required plugin surface, governed registration, and path boundary conform, while an axios import fires C3 and returns a blocking file-and-line diagnosis.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#263249" stroke-width="1" opacity="0.28"/>
    </pattern>
    <marker id="cyanArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#61c9ef"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#f05c67"/>
    </marker>
    <style>
      .sans{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace}.title{font-size:32px;font-weight:720;fill:#e8ebed;letter-spacing:-.4px}.heading{font-size:28px;font-weight:700;fill:#e8ebed}.label{font-size:20px;font-weight:700;letter-spacing:1px;fill:#7890a3}.body{font-size:24px;fill:#c9d5e1}.code{font-size:24px;fill:#e8ebed}.small{font-size:20px;fill:#7890a3}.cyan{fill:#61c9ef}.green{fill:#48c99a}.red{fill:#f05c67}.stroke{vector-effect:non-scaling-stroke}
    </style>
  </defs>
  <rect width="760" height="1120" rx="4" fill="#080919"/>
  <rect width="760" height="1120" rx="4" fill="url(#grid)"/>

  <text x="40" y="58" class="sans title">One contract. One graph. One verdict.</text>
  <path d="M40 82H720" stroke="#36445b" stroke-width="1" class="stroke"/>

  <text x="40" y="128" class="mono heading cyan">EngineeringBlueprint</text>
  <text x="40" y="160" class="sans small">human-owned · reviewed · versioned</text>
  <path d="M40 182H720M40 250H720M40 318H720M40 386H720M40 454H720" stroke="#303d53" stroke-width="1" class="stroke"/>

  <text x="40" y="222" class="mono label cyan">C1</text><text x="96" y="214" class="mono code">requiredComponent</text><text x="96" y="241" class="mono small">pluginSurface</text><circle cx="697" cy="216" r="9" fill="#48c99a"/>
  <text x="40" y="290" class="mono label cyan">C2</text><text x="96" y="282" class="mono code">requiredDependency</text><text x="96" y="309" class="mono small">pluginSurface → provides</text><circle cx="697" cy="284" r="9" fill="#48c99a"/>
  <text x="40" y="358" class="mono label red">C3</text><text x="96" y="350" class="mono code">forbiddenDependency</text><text x="96" y="377" class="mono small">* → axios</text><circle cx="697" cy="352" r="9" fill="#f05c67"/>
  <text x="40" y="426" class="mono label cyan">C4</text><text x="96" y="418" class="mono code">forbiddenPath</text><text x="96" y="445" class="mono small">src/legacy/**</text><circle cx="697" cy="420" r="9" fill="#48c99a"/>

  <path d="M380 470V512" stroke="#61c9ef" stroke-width="2.5" marker-end="url(#cyanArrow)" class="stroke"/>
  <text x="40" y="548" class="sans heading">Observed repository graph</text>
  <text x="40" y="580" class="mono small">AST extraction + coverage envelope</text>

  <rect x="40" y="606" width="680" height="82" rx="4" fill="#101629" stroke="#61c9ef" stroke-width="1.5" class="stroke"/>
  <text x="64" y="638" class="mono label cyan">PLUGIN SURFACE</text>
  <text x="64" y="670" class="mono code">extension:greeting.plugin</text>

  <path d="M168 688V735" stroke="#61c9ef" stroke-width="2.5" marker-end="url(#cyanArrow)" class="stroke"/>
  <text x="188" y="723" class="mono small cyan">provides</text>
  <rect x="40" y="740" width="282" height="66" rx="4" fill="#101629" stroke="#566274" stroke-width="1.5" class="stroke"/>
  <text x="64" y="781" class="mono code">registerTool</text>

  <path d="M591 688V735" stroke="#f05c67" stroke-width="2.5" marker-end="url(#redArrow)" class="stroke"/>
  <text x="468" y="723" class="mono small red">imports</text>
  <rect x="456" y="740" width="264" height="66" rx="4" fill="#24121e" stroke="#f05c67" stroke-width="1.5" class="stroke"/>
  <text x="588" y="781" text-anchor="middle" class="mono code red">axios</text>

  <path d="M40 838H720" stroke="#566274" stroke-width="1.5" stroke-dasharray="8 8" class="stroke"/>
  <text x="40" y="870" class="mono small">src/greeting.plugin.ts</text>
  <text x="720" y="870" text-anchor="end" class="sans small green">outside src/legacy/**</text>

  <path d="M380 890V932" stroke="#f05c67" stroke-width="2.5" marker-end="url(#redArrow)" class="stroke"/>
  <rect x="40" y="940" width="680" height="140" rx="4" fill="#10101e" stroke="#f05c67" stroke-width="1.5" class="stroke"/>
  <text x="64" y="978" class="mono label red">1 · BLOCK</text>
  <text x="64" y="1014" class="mono code">C3 · no-direct-http-client</text>
  <text x="64" y="1050" class="mono code red">extension:greeting.plugin → axios</text>
  <text x="64" y="1081" class="mono small">src/greeting.plugin.ts · line 16</text>
  <text x="720" y="1105" text-anchor="end" class="mono small green">0 · MERGE when conforming</text>
</svg>
