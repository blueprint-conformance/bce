<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-labelledby="title desc">
  <title id="title">The BCE adoption ratchet</title>
  <desc id="desc">Advisory mode reveals the current architecture drift. A shrink-only baseline records known debt and prevents it from growing. Enforced mode blocks new violations. Moving backward requires a reviewed rationale.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#61c9ef"/>
    </marker>
    <marker id="return-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7890a3"/>
    </marker>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1280" height="330" fill="#080919"/>

  <g class="sans">
    <text x="40" y="58" font-size="28" font-weight="700" letter-spacing="-.4" fill="#e8ebed">MOVE FORWARD WITHOUT HIDING DEBT.</text>
    <text class="mono" x="1240" y="57" text-anchor="end" font-size="14" font-weight="550" letter-spacing="1.1" fill="#7890a3">COMMITTED POLICY · VISIBLE HISTORY</text>

    <g>
      <rect x="40" y="100" width="300" height="104" rx="4" fill="#080919" stroke="#566274" stroke-width="1.5"/>
      <text class="mono" x="64" y="139" font-size="13" font-weight="650" letter-spacing="1.2" fill="#61c9ef">ADVISORY</text>
      <text x="64" y="174" font-size="20" font-weight="600" fill="#e8ebed">See the current drift</text>

      <path d="M340 152H456" fill="none" stroke="#61c9ef" stroke-width="2.2" marker-end="url(#arrow)"/>

      <rect x="470" y="100" width="340" height="104" rx="4" fill="#080919" stroke="#566274" stroke-width="1.5"/>
      <text class="mono" x="494" y="139" font-size="13" font-weight="650" letter-spacing="1.2" fill="#61c9ef">SHRINK-ONLY BASELINE</text>
      <text x="494" y="174" font-size="20" font-weight="600" fill="#e8ebed">Debt may fall, never grow</text>

      <path d="M810 152H886" fill="none" stroke="#61c9ef" stroke-width="2.2" marker-end="url(#arrow)"/>

      <rect x="900" y="100" width="340" height="104" rx="4" fill="#080919" stroke="#48c99a" stroke-width="1.8"/>
      <text class="mono" x="924" y="139" font-size="13" font-weight="650" letter-spacing="1.2" fill="#48c99a">ENFORCED</text>
      <text x="924" y="174" font-size="20" font-weight="600" fill="#e8ebed">New violations block</text>
    </g>

    <path d="M1070 220V262H222Q206 262 206 246V218" fill="none" stroke="#7890a3" stroke-width="1.8" stroke-dasharray="8 8" marker-end="url(#return-arrow)"/>
    <rect x="462" y="238" width="356" height="48" rx="4" fill="#080919"/>
    <text class="mono" x="640" y="268" text-anchor="middle" font-size="14" font-weight="550" letter-spacing="1" fill="#94a5b3">DOWNGRADE REQUIRES REVIEWED RATIONALE</text>
  </g>
</svg>
