<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="410" viewBox="0 0 1280 410" role="img" aria-labelledby="title desc">
  <title id="title">How BCE fits into the agent development loop</title>
  <desc id="desc">A human-owned blueprint and an agent code change enter the same deterministic BCE gate. Conforming changes merge. Drift receives a precise diagnosis and loops back to the agent for correction. Policy changes return to human review.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091522"/>
      <stop offset="1" stop-color="#0d1c2a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#5f7e94"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#4ed3a3"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#ff6b73"/>
    </marker>
  </defs>

  <rect width="1280" height="410" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="408" rx="15" fill="none" stroke="#294359"/>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="48" y="45" font-size="13" font-weight="700" fill="#6dd6ff" letter-spacing="2">ONE LOOP · ONE SOURCE OF TRUTH</text>
    <text x="48" y="76" font-size="20" font-weight="700" fill="#eef7ff">BCE stays out of generation and owns the decision boundary.</text>

    <g transform="translate(48 116)">
      <rect width="224" height="108" rx="14" fill="#102537" stroke="#38718f"/>
      <text x="18" y="29" font-size="11" font-weight="700" fill="#6dd6ff" letter-spacing="1.4">HUMAN-OWNED</text>
      <text x="18" y="56" font-size="18" font-weight="700" fill="#eef7ff">Blueprint</text>
      <text x="18" y="80" font-size="13" fill="#9db1c2">What the architecture</text>
      <text x="18" y="98" font-size="13" fill="#9db1c2">is allowed to become</text>

      <rect y="134" width="224" height="74" rx="14" fill="#121d2b" stroke="#33495b"/>
      <text x="18" y="163" font-size="11" font-weight="700" fill="#9db1c2" letter-spacing="1.4">VISIBLE GOVERNANCE</text>
      <text x="18" y="188" font-size="13" fill="#c9d8e3">Amend policy by review</text>
      <path d="M112 134V118" fill="none" stroke="#5f7e94" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

      <rect x="298" width="224" height="108" rx="14" fill="#102537" stroke="#38718f"/>
      <text x="316" y="29" font-size="11" font-weight="700" fill="#6dd6ff" letter-spacing="1.4">FAST PATH</text>
      <text x="316" y="56" font-size="18" font-weight="700" fill="#eef7ff">Agent change</text>
      <text x="316" y="80" font-size="13" fill="#9db1c2">Normal tools, prompts,</text>
      <text x="316" y="98" font-size="13" fill="#9db1c2">and pull requests</text>

      <path d="M234 54H288" fill="none" stroke="#5f7e94" stroke-width="2.2" marker-end="url(#arrow)"/>
      <path d="M532 54H586" fill="none" stroke="#5f7e94" stroke-width="2.2" marker-end="url(#arrow)"/>

      <rect x="596" y="10" width="188" height="88" rx="44" fill="#153047" stroke="#6dd6ff" stroke-width="1.5"/>
      <text x="690" y="49" text-anchor="middle" font-size="17" font-weight="750" fill="#eef7ff" letter-spacing="1.6">BCE GATE</text>
      <text x="690" y="72" text-anchor="middle" font-size="12" fill="#9db1c2">same engine everywhere</text>

      <path d="M794 38H860" fill="none" stroke="#4ed3a3" stroke-width="2.5" marker-end="url(#green-arrow)"/>
      <rect x="870" width="224" height="74" rx="14" fill="#102a25" stroke="#3da77f"/>
      <text x="888" y="29" font-size="11" font-weight="700" fill="#4ed3a3" letter-spacing="1.4">CONFORMS</text>
      <text x="888" y="55" font-size="17" font-weight="700" fill="#d9f8ea">Merge with confidence</text>

      <path d="M690 108V142H860" fill="none" stroke="#ff6b73" stroke-width="2.5" marker-end="url(#red-arrow)"/>
      <rect x="870" y="114" width="224" height="94" rx="14" fill="#2a171f" stroke="#a83e4d"/>
      <text x="888" y="143" font-size="11" font-weight="700" fill="#ff6b73" letter-spacing="1.4">DRIFT</text>
      <text x="888" y="169" font-size="17" font-weight="700" fill="#ffdadd">Block + name the fix</text>
      <text x="888" y="190" font-size="12" fill="#c9a9ad">rule · edge · file · line</text>

      <path d="M870 190H815V246H410V118" fill="none" stroke="#ff6b73" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#red-arrow)"/>
      <text x="615" y="265" text-anchor="middle" font-size="12" font-weight="650" fill="#ff959a" letter-spacing="0.8">FIX CODE → RE-RUN THE SAME GATE</text>
    </g>
  </g>
</svg>
