    </g>
    <text x="210" y="273" fill="#E8EBED" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="650">bce gate</text>

    <path d="M250 302V334" fill="none" stroke="#FF6B73" stroke-width="2.5" marker-end="url(#arrow-red)"/>

    <rect x="32" y="336" width="436" height="116" rx="6" fill="#251622" stroke="#FF6B73" stroke-width="2"/>
    <text x="52" y="367" fill="#FF6B73" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">1 · BLOCKED · C3</text>
    <text x="52" y="398" fill="#E8EBED" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">extension:greeting.plugin → axios</text>
    <text x="52" y="428" fill="#A9BDCE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">src/greeting.plugin.ts#L16</text>

    <text x="32" y="478" fill="#7890A3" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">Deterministic · local · fail-closed</text>
  </g>
</svg>
