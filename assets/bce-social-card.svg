<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">bce — architecture rules your agents cannot quietly break</title>
  <desc id="desc">The BCE six-node mark and product promise sit beside a real conformance path: a human-owned blueprint and agent change enter the local gate, which catches a forbidden axios dependency and blocks the merge at its source line.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="0.58" stop-color="#0B1D2D"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#244058" stroke-width="1" stroke-opacity="0.2"/>
    </pattern>
    <marker id="arrow-steel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#58758C"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#FF6B73"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect x="1" y="1" width="1278" height="638" fill="none" stroke="#274157" stroke-width="2"/>

  <g transform="translate(74 66)">
    <g>
      <rect x="0" y="0" width="20" height="20" rx="4" fill="#17384F" stroke="#6DD6FF" stroke-width="2"/>
      <rect x="27" y="0" width="20" height="20" rx="4" fill="#17384F" stroke="#6DD6FF" stroke-width="2"/>
      <rect x="54" y="0" width="20" height="20" rx="4" fill="#164A40" stroke="#4ED3A3" stroke-width="2"/>
      <rect x="0" y="27" width="20" height="20" rx="4" fill="#164A40" stroke="#4ED3A3" stroke-width="2"/>
      <rect x="27" y="27" width="20" height="20" rx="4" fill="#7F1D2D" stroke="#FF6B73" stroke-width="2"/>
      <rect x="54" y="27" width="20" height="20" rx="4" fill="#17384F" stroke="#6DD6FF" stroke-width="2"/>
    </g>
    <text x="100" y="42" fill="#E8EBED" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="760" letter-spacing="-1">bce</text>
  </g>

  <g fill="#E8EBED" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="57" font-weight="760" letter-spacing="-1.4">
    <text x="74" y="224">Architecture rules</text>
    <text x="74" y="291">your agents cannot</text>
    <text x="74" y="358">quietly break.</text>
  </g>
  <text x="76" y="460" fill="#A9BDCE" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="520">
    Version the boundary. Catch drift. Block the merge.
  </text>
  <line x1="76" y1="514" x2="626" y2="514" stroke="#61C9EF" stroke-width="3"/>
  <text x="76" y="564" fill="#C9D5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">blueprint-conformance/bce</text>
  <text x="76" y="596" fill="#7890A3" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">CLI · GitHub Action · MCP · Agent Skill</text>

