<svg xmlns="http://www.w3.org/2000/svg" width="1107" height="396" viewBox="0 0 1107 396" role="img" aria-labelledby="cast-title cast-desc">
  <title id="cast-title">bce refusing a forbidden import, then passing the corrected tree</title>
  <desc id="cast-desc">An animated terminal replay of the hero demo. The gate is run against a drifted tree and fails with exit code 1, naming the forbidden edge and the file and line it was found at; it is then run against the corrected tree and passes with exit code 0. The same transcript appears as selectable text in the README code block below this image.</desc>
  <style>
    /* opacity:1 is the BASE state and the animation is what hides, never the
       reverse. A renderer that does not run CSS animations — a static
       rasterizer, a feed reader, a proxy that flattens the asset — then shows
       the COMPLETE transcript instead of an empty terminal, which is the whole
       point of the image. Authored the other way round (base 0, revealed by the
       animation) this degrades to a blank plate, which is how a hero asset ends
       up silently selling nothing. */
    .ln{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace;font-size:11.5px;opacity:1}
    .cmd{fill:#7FD3F7}.err{fill:#F0555B}.ok{fill:#3FB950}.out{fill:#C9D5E1}
    @keyframes r0{0%{opacity:0}0.01%,100%{opacity:1}}
    @keyframes r1{0%,5.04%{opacity:0}5.05%,100%{opacity:1}}
    @keyframes r2{0%,10.08%{opacity:0}10.09%,100%{opacity:1}}
    @keyframes r3{0%,15.13%{opacity:0}15.14%,100%{opacity:1}}
    @keyframes r4{0%,20.17%{opacity:0}20.18%,100%{opacity:1}}
    @keyframes r5{0%,25.21%{opacity:0}25.22%,100%{opacity:1}}
    @keyframes r6{0%,30.25%{opacity:0}30.26%,100%{opacity:1}}
    @keyframes r7{0%,35.29%{opacity:0}35.3%,100%{opacity:1}}
    @keyframes r8{0%,40.34%{opacity:0}40.35%,100%{opacity:1}}
    @keyframes r9{0%,47.9%{opacity:0}47.91%,100%{opacity:1}}
    @keyframes r10{0%,52.94%{opacity:0}52.95%,100%{opacity:1}}
    @keyframes r11{0%,57.98%{opacity:0}57.99%,100%{opacity:1}}
    @keyframes r12{0%,65.55%{opacity:0}65.56%,100%{opacity:1}}
    @keyframes r13{0%,70.59%{opacity:0}70.6%,100%{opacity:1}}
    @keyframes r14{0%,75.63%{opacity:0}75.64%,100%{opacity:1}}
    @keyframes r15{0%,83.19%{opacity:0}83.2%,100%{opacity:1}}
    @keyframes r16{0%,88.24%{opacity:0}88.25%,100%{opacity:1}}
    @keyframes r17{0%,93.28%{opacity:0}93.29%,100%{opacity:1}}
    .l0{animation:r0 5.95s linear forwards}.l1{animation:r1 5.95s linear forwards}.l2{animation:r2 5.95s linear forwards}.l3{animation:r3 5.95s linear forwards}.l4{animation:r4 5.95s linear forwards}.l5{animation:r5 5.95s linear forwards}.l6{animation:r6 5.95s linear forwards}.l7{animation:r7 5.95s linear forwards}.l8{animation:r8 5.95s linear forwards}.l9{animation:r9 5.95s linear forwards}.l10{animation:r10 5.95s linear forwards}.l11{animation:r11 5.95s linear forwards}.l12{animation:r12 5.95s linear forwards}.l13{animation:r13 5.95s linear forwards}.l14{animation:r14 5.95s linear forwards}.l15{animation:r15 5.95s linear forwards}.l16{animation:r16 5.95s linear forwards}.l17{animation:r17 5.95s linear forwards}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    .cursor{animation:blink 1.06s steps(1) infinite}
    /* Reduced motion gets the same complete transcript, held still. */
    @media (prefers-reduced-motion: reduce){
      .ln{opacity:1;animation:none}
      .cursor{animation:none;opacity:0}
    }
  </style>
  <rect width="1107" height="396" rx="8" fill="#0B1622"/>
  <rect width="1107" height="38" rx="8" fill="#111E2C"/>
  <rect y="30" width="1107" height="8" fill="#111E2C"/>
  <line x1="0" y1="38" x2="1107" y2="38" stroke="#1B3A52" stroke-width="1"/>
  <circle cx="20" cy="19" r="5" fill="#F0555B"/>
  <circle cx="38" cy="19" r="5" fill="#D9A441"/>
  <circle cx="56" cy="19" r="5" fill="#3FB950"/>
  <text x="76" y="23" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5C748C">bce — one contract, two trees, real exit codes</text>
  <g id="cast-lines">
    <text class="ln cmd l0" x="22" y="52" textLength="489.9" lengthAdjust="spacingAndGlyphs" xml:space="preserve">$ bce gate --repo drift --blueprint-dir blueprint --extractor ast --all</text>
    <text class="ln err l1" x="22" y="71" textLength="945.3" lengthAdjust="spacingAndGlyphs" xml:space="preserve">::error::blueprint no-direct-http-client@0.1.0 FAILED — score 60: 1 NEW violation(s). 1 constraint(s) evaluated; 1 violation(s); score 60</text>
    <text class="ln err l2" x="22" y="90" textLength="407.1" lengthAdjust="spacingAndGlyphs" xml:space="preserve">::error::  no-direct-http-client (critical): 1 violation(s)</text>
    <text class="ln err l3" x="22" y="109" textLength="503.7" lengthAdjust="spacingAndGlyphs" xml:space="preserve">::error::    - [no-direct-http-client/critical] extension:greeting.plugin</text>
    <text class="ln out l4" x="22" y="128" textLength="538.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">        observed: forbidden edge extension:greeting.plugin -&gt; axios is present</text>
    <text class="ln out l5" x="22" y="147" textLength="213.9" lengthAdjust="spacingAndGlyphs" xml:space="preserve">        expected: no axios edge</text>
    <text class="ln out l6" x="22" y="166" textLength="303.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">        at:       src/greeting.plugin.ts#L16</text>
    <text class="ln out l7" x="22" y="185" textLength="1062.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">      fix: change the code to satisfy 'no-direct-http-client'  |  amend: if the rule is wrong, edit/remove 'no-direct-http-client' in the blueprint via PR</text>
    <text class="ln out l8" x="22" y="204" textLength="407.1" lengthAdjust="spacingAndGlyphs" xml:space="preserve">bce gate [enforced]: 1/1 blueprint(s) evaluated, 1 failing.</text>
    <text class="ln cmd l9" x="22" y="223" textLength="62.1" lengthAdjust="spacingAndGlyphs" xml:space="preserve">$ echo $?</text>
    <text class="ln err l10" x="22" y="242" textLength="6.9" lengthAdjust="spacingAndGlyphs" xml:space="preserve">1</text>
    <text class="ln out l11" x="22" y="261" xml:space="preserve"></text>
    <text class="ln cmd l12" x="22" y="280" textLength="448.5" lengthAdjust="spacingAndGlyphs" xml:space="preserve">$ bce gate --repo clean --blueprint-dir blueprint --extractor ast</text>
    <text class="ln ok l13" x="22" y="299" textLength="345" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  ✓ no-direct-http-client@0.1.0 — score 100 (pass)</text>
    <text class="ln out l14" x="22" y="318" textLength="407.1" lengthAdjust="spacingAndGlyphs" xml:space="preserve">bce gate [enforced]: 1/1 blueprint(s) evaluated, 0 failing.</text>
    <text class="ln cmd l15" x="22" y="337" textLength="62.1" lengthAdjust="spacingAndGlyphs" xml:space="preserve">$ echo $?</text>
    <text class="ln ok l16" x="22" y="356" textLength="6.9" lengthAdjust="spacingAndGlyphs" xml:space="preserve">0</text>
    <text class="ln out l17" x="22" y="375" xml:space="preserve"></text>
  </g>
  <rect class="cursor" x="22" y="365" width="6.9" height="13" fill="#7FD3F7"/>
</svg>
