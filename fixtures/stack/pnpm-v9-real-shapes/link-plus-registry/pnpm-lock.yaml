lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    dependencies:
      is-number:
        specifier: 7.0.0
        version: 7.0.0

  packages/a:
    dependencies:
      b:
        specifier: workspace:*
        version: link:../b

  packages/b:
    dependencies:
      a:
        specifier: workspace:^
        version: link:../a
